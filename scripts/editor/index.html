<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="editor-token" content="__EDITOR_TOKEN__">
  <title>Portfolio · 本地项目编辑器</title>
  <link rel="stylesheet" href="/editor.css">
  <script type="module" src="/editor.js"></script>
</head>
<body>
  <a class="skip" href="#content">跳到编辑内容</a>
  <aside>
    <div class="brand"><span class="eyebrow">HAN ZHANG / LOCAL</span><h1>项目编辑器</h1><p>编辑作品，保存后在网站中预览。</p></div>
    <button id="new-project" type="button" class="primary" disabled>＋ 新增项目</button>
    <label class="search">查找项目<input id="search" type="search" placeholder="标题或分类"></label>
    <nav id="projects" aria-label="选择项目"></nav>
    <p class="aside-note">保存到当前本地仓库。<br>线上内容将在发布后更新。</p>
  </aside>
  <main id="content">
    <header class="toolbar">
      <div><span class="eyebrow" id="project-category">PORTFOLIO</span><h2 id="project-title">正在读取项目…</h2><p id="status" role="status" aria-live="polite">连接本地编辑器</p></div>
      <div class="actions"><a id="preview" target="_blank" rel="noopener" aria-disabled="true">预览已保存页面 ↗</a><button id="reload" type="button">重新载入</button><button id="save" class="primary" type="submit" form="editor" disabled>保存项目</button></div>
    </header>
    <p id="message" role="alert" hidden></p>
    <form id="editor"><fieldset id="fields" disabled></fieldset></form>
  </main>
  <dialog id="create-dialog" aria-labelledby="create-title">
    <form id="create-project">
      <h2 id="create-title">新增项目</h2>
      <p>先创建隐藏草稿，再完善正文和图片。准备好后取消隐藏即可展示。</p>
      <fieldset id="create-fields">
        <label class="field">项目标题<input name="title" required maxlength="200" autofocus></label>
        <label class="field">项目地址<input name="slug" required maxlength="80" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="my-new-project" aria-describedby="slug-help"></label>
        <p class="hint" id="slug-help">使用小写英文字母、数字和连字符，例如 my-new-project。创建后地址固定为 /work/my-new-project。</p>
        <label class="field">分类<select name="category" id="new-category"></select></label>
        <div class="actions"><button type="button" id="cancel-create">取消</button><button class="primary" type="submit">创建项目</button></div>
      </fieldset>
      <p id="create-error" role="alert" hidden></p>
    </form>
  </dialog>
</body>
</html>
